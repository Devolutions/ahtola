name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the v prefix
        required: true
        type: string
      dry_run:
        description: Build, sign, and validate artifacts without creating a release or publishing; choose test signing with github_env=test
        default: false
        required: false
        type: boolean
      github_env:
        description: Protected GitHub environment that owns signing and publishing credentials; select test for test signing
        default: auto
        required: false
        type: choice
        options:
          - auto
          - test
          - prod

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PLATYPS_VERSION: 1.0.3
  PSIGN_MODULE_VERSION: 0.6.2
  PSIGN_MODULE_SHA256: ec833a64291d3a3b0b95403d9b2235ef156c124899bb0031f0278ff01e32bc81

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish_env: ${{ steps.release.outputs.publish_env }}
    steps:
      - name: Validate version and resolve release environment
        id: release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_ENV: ${{ inputs.github_env }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw 'version must be a stable numeric PowerShell module version, for example 1.2.3.'
          }

          $dryRun = [System.Boolean]::Parse($env:DRY_RUN)
          $isMaster = $env:GITHUB_REF -eq 'refs/heads/master'
          if (-not $dryRun -and -not $isMaster) {
            throw 'Non-dry-run releases must be dispatched from the master branch.'
          }

          $publishEnvironment = if (-not $isMaster) {
            'publish-test'
          } elseif ($env:REQUESTED_ENV -eq 'test') {
            'publish-test'
          } else {
            'publish-prod'
          }

          "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT
          "tag=v$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT
          "publish_env=$publishEnvironment" >> $env:GITHUB_OUTPUT

  pack:
    name: Build and package release artifacts
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js for browser validation
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore
        shell: pwsh
        run: ./build.ps1 restore

      - name: Install PlatyPS
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.PowerShell.PlatyPS -RequiredVersion $env:PLATYPS_VERSION `
            -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Pack Release nupkgs
        shell: pwsh
        run: ./build.ps1 pack -Configuration Release -PackageVersion ${{ needs.preflight.outputs.version }}

      - name: Pack PowerShell module
        shell: pwsh
        run: ./build.ps1 pack-powershell -Configuration Release -PackageVersion ${{ needs.preflight.outputs.version }}

      - name: Validate packed closure
        shell: pwsh
        run: ./build.ps1 validate-packed-closure

      - name: Validate packed browser consumer
        shell: pwsh
        run: |
          ./scripts/Invoke-BrowserPackageConsumer.ps1 `
            -PackageDirectory ./artifacts/managed-packages `
            -PackageVersion ${{ needs.preflight.outputs.version }}

      - name: Upload nupkgs
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/managed-packages/*.nupkg
          if-no-files-found: error

      - name: Upload PowerShell module
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-powershell-module
          path: artifacts/powershell-modules/Devolutions.Ahtola.Sqlite/**
          if-no-files-found: error

  sign_powershell_module:
    name: Sign PowerShell module with Azure Artifact Signing
    needs:
      - preflight
      - pack
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.publish_env }}
    permissions:
      contents: read
      id-token: write
    outputs:
      signed: ${{ steps.sign_plan.outputs.should_sign }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
      TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
      TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
    steps:
      - name: Download PowerShell module
        uses: actions/download-artifact@v8
        with:
          name: unsigned-powershell-module
          # upload-artifact strips the module directory because its path ends
          # in /**. Restore that directory before signing and re-uploading it.
          path: artifacts/powershell-modules/Devolutions.Ahtola.Sqlite

      - name: Validate signing configuration
        id: sign_plan
        shell: pwsh
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'TRUSTED_SIGNING_ENDPOINT',
            'TRUSTED_SIGNING_ACCOUNT_NAME',
            'TRUSTED_SIGNING_PROFILE_NAME'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Azure Artifact Signing requires: $($missing -join ', ')"
          }

          'should_sign=true' >> $env:GITHUB_OUTPUT

      - name: Download released PSign PowerShell module
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Devolutions.Psign.zip'
          $uri = "https://github.com/Devolutions/psign/releases/download/v$env:PSIGN_MODULE_VERSION/Devolutions.Psign.$env:PSIGN_MODULE_VERSION.nupkg"
          Invoke-WebRequest -Uri $uri -OutFile $archive

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:PSIGN_MODULE_SHA256) {
            throw "PSign module checksum mismatch. Expected $env:PSIGN_MODULE_SHA256, got $actualHash."
          }

          $toolDirectory = Join-Path $env:RUNNER_TEMP 'psign-module'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory -Force
          $manifestPath = Join-Path $toolDirectory 'Devolutions.Psign.psd1'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Released PSign module manifest was not found at $manifestPath."
          }

          Import-Module $manifestPath -Force -ErrorAction Stop
          foreach ($command in 'Set-PsignSignature', 'Get-PsignSignature') {
            if (-not (Get-Command $command -Module Devolutions.Psign -ErrorAction SilentlyContinue)) {
              throw "Released PSign module did not export $command."
            }
          }
          "PSIGN_MODULE_MANIFEST=$manifestPath" >> $env:GITHUB_ENV

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign PowerShell module payload
        shell: pwsh
        run: |
          Import-Module $env:PSIGN_MODULE_MANIFEST -Force -ErrorAction Stop

          $accessToken = az account get-access-token `
            --scope https://codesigning.azure.net/.default `
            --query accessToken `
            --output tsv
          if ([string]::IsNullOrWhiteSpace($accessToken)) {
            throw 'Could not obtain an Azure Artifact Signing access token.'
          }

          $manifests = @(
            Get-ChildItem -LiteralPath artifacts/powershell-modules -Recurse `
              -Filter Devolutions.Ahtola.Sqlite.psd1 -File
          )
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one module manifest, found $($manifests.Count)."
          }

          $moduleRoot = $manifests[0].DirectoryName
          $signableExtensions = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase
          )
          foreach ($extension in '.ps1', '.psm1', '.psd1', '.dll') {
            [void]$signableExtensions.Add($extension)
          }

          $targets = Get-ChildItem -LiteralPath $moduleRoot -Recurse -File |
            Where-Object { $signableExtensions.Contains($_.Extension) } |
            Sort-Object FullName
          if ($targets.Count -eq 0) {
            throw "No PowerShell module payload files were found to sign in $moduleRoot."
          }

          foreach ($target in $targets) {
            $signArgs = @{
              LiteralPath = $target.FullName
              ArtifactSigningEndpoint = $env:TRUSTED_SIGNING_ENDPOINT
              ArtifactSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT_NAME
              ArtifactSigningProfileName = $env:TRUSTED_SIGNING_PROFILE_NAME
              ArtifactSigningAccessToken = $accessToken
              TimestampServer = $env:TRUSTED_SIGNING_TIMESTAMP_SERVER
              TimestampHashAlgorithm = 'Sha256'
              HashAlgorithm = 'Sha256'
              Force = $true
              ErrorAction = 'Stop'
            }
            Set-PsignSignature @signArgs | Out-Null

            $signature = Get-PsignSignature -LiteralPath $target.FullName -ErrorAction Stop
            if ($signature.SignatureType.ToString() -ne 'Authenticode' -or
                $signature.Status.ToString() -notin 'Valid', 'NotTrusted') {
              throw "Expected an intact Authenticode signature for $($target.FullName), got '$($signature.Status)': $($signature.StatusMessage)"
            }
          }

      - name: Package signed PowerShell module for PSGallery
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -LiteralPath artifacts/powershell-modules -Recurse `
            -Filter Devolutions.Ahtola.Sqlite.psd1 -File |
            Select-Object -First 1
          if (-not $manifest) {
            throw 'Signed PowerShell module manifest was not found.'
          }

          $moduleRoot = $manifest.DirectoryName
          Test-ModuleManifest -Path $manifest.FullName -ErrorAction Stop | Out-Null
          $packageRoot = 'artifacts/release-assets'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -Force -ErrorAction Stop
          $modulePackage = Compress-PSResource `
            -Path $moduleRoot `
            -DestinationPath $packageRoot `
            -PassThru `
            -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $modulePackage -PathType Leaf)) {
            throw "PowerShell module package was not created at $modulePackage."
          }

      - name: Upload signed PowerShell module
        uses: actions/upload-artifact@v7
        with:
          name: signed-powershell-module
          path: artifacts/powershell-modules/Devolutions.Ahtola.Sqlite/**
          if-no-files-found: error

      - name: Upload signed PowerShell module package
        uses: actions/upload-artifact@v7
        with:
          name: signed-powershell-module-package
          path: artifacts/release-assets/*.nupkg
          if-no-files-found: error

  github_release:
    name: Create GitHub release
    needs:
      - preflight
      - pack
      - sign_powershell_module
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
          # gh release create/view resolve the repo via local git; without a
          # checkout they fail with "fatal: not a git repository".
          - name: Checkout
            uses: actions/checkout@v6
            with:
              fetch-depth: 0

          - name: Download nupkgs
            uses: actions/download-artifact@v8
            with:
              name: release-packages
              path: artifacts/managed-packages

          - name: Download signed PowerShell module package
            uses: actions/download-artifact@v8
            with:
              name: signed-powershell-module-package
              path: artifacts/release-assets

          - name: Create or update release
            shell: pwsh
            env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
              RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              TARGET_SHA: ${{ github.sha }}
            run: |
              $assets = @(
                Get-ChildItem -LiteralPath artifacts/managed-packages -Filter *.nupkg -File
                Get-ChildItem -LiteralPath artifacts/release-assets -Filter *.nupkg -File
              )
              if ($assets.Count -eq 0) {
                throw 'No release assets were found.'
              }

              $assetPaths = $assets | ForEach-Object FullName
              gh release view $env:RELEASE_TAG 2>$null
              if ($LASTEXITCODE -eq 0) {
                gh release upload $env:RELEASE_TAG @assetPaths --clobber
              } else {
                gh release create $env:RELEASE_TAG @assetPaths `
                  --target $env:TARGET_SHA `
                  --title "v$env:RELEASE_VERSION" `
                  --generate-notes
              }

  publish_nuget:
    name: Publish to NuGet.org
    needs:
      - preflight
      - pack
      - sign_powershell_module
      - github_release
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.publish_env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download nupkgs
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts/managed-packages

      - name: NuGet login with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_BOT_USERNAME }}

      - name: Push nupkgs
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet/login did not return an API key.'
          }

          Get-ChildItem -LiteralPath artifacts/managed-packages -Filter *.nupkg -File |
            Sort-Object Name |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key $env:NUGET_API_KEY `
                --source $env:NUGET_SOURCE `
                --skip-duplicate
            }

  publish_psgallery:
    name: Publish to PowerShell Gallery
    needs:
      - preflight
      - sign_powershell_module
      - github_release
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.publish_env }}
    permissions:
      contents: read
    steps:
      - name: Download signed PowerShell module package
        uses: actions/download-artifact@v8
        with:
          name: signed-powershell-module-package
          path: artifacts/release-assets

      - name: Publish signed module package
        shell: pwsh
        env:
          PSGALLERY_NUGET_API_KEY: ${{ secrets.PSGALLERY_NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_NUGET_API_KEY)) {
            throw 'PSGALLERY_NUGET_API_KEY is not configured for this environment.'
          }

          $packages = @(
            Get-ChildItem -LiteralPath artifacts/release-assets `
              -Filter Devolutions.Ahtola.Sqlite.*.nupkg -File
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one signed PowerShell module package, found $($packages.Count)."
          }

          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -Force -ErrorAction Stop
          Publish-PSResource `
            -NupkgPath $packages[0].FullName `
            -Repository PSGallery `
            -ApiKey $env:PSGALLERY_NUGET_API_KEY `
            -Verbose `
            -ErrorAction Stop
